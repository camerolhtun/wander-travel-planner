[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends()/Header() in defaults is the intended FastAPI pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["UP035", "UP007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
